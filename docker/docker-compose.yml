services:
  datamaps-nginx:
    container_name: "datamaps-nginx"
    image: datamaps-nginx:latest
    build:
      context: ../.
      dockerfile: docker/nginx/Dockerfile
    command: [nginx, "-g", "daemon off;"]
    depends_on:
      - datamaps-php
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - "$PWD/..:/var/datamaps"
    ports:
      - "${HOST_IP}:10180:80"
    networks:
      - datamaps-network

  datamaps-php:
    container_name: "datamaps-php"
    image: datamaps-php:latest
    build:
      context: .
      dockerfile: php/Dockerfile
      tags:
        - latest
    user: "${USERID}:${GROUPID}"
    volumes:
      - ../../log:/var/datamaps/log
      - "$PWD/..:/var/datamaps"
      - "$PWD/..:$PWD/.."
    working_dir: $PWD/..
    depends_on:
      datamaps-mariadb:
        condition: service_started
    networks:
      - datamaps-network

  datamaps-mariadb:
    image: datamaps-mariadb:latest
    container_name: "datamaps-mariadb"
    build:
      context: .
      dockerfile: mariadb/Dockerfile
      tags:
        - latest
    restart: always
    volumes:
      - /home/debian/projet/datamaps-mariadb/_data:/var/lib/mysql
      - ../../mariabackup:/backup
    env_file:
      - ./mariadb/db.env
    networks:
      - datamaps-network

  datamaps-swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.12
    container_name: "datamaps-swagger-ui"
    restart: always
    volumes: 
      - ./swagger/v1:/v1
    environment:
      PORT_IPV6: 8080
      SUPPORTED_SUBMIT_METHODS: "['get', 'post', 'put', 'delete', 'patch']"
      SWAGGER_JSON: /v1/doc.yaml
    ports:
      - ${HOST_IP}:10182:8080
    networks:
      - datamaps-network

  datamaps-phpmyadmin:
    image: phpmyadmin
    container_name: "datamaps-phpmyadmin"
    restart: always
    environment:
      PMA_HOST: datamaps-mariadb
    depends_on:
      - datamaps-mariadb
    ports:
      - "${HOST_IP}:10190:80"
    networks:
      - datamaps-network

networks:
  datamaps-network:
    driver: bridge
    name: datamaps-network
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:1:20::/112
          gateway: fd00:1:20::1
